name: Build RocketBootstrap Rootless

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Configure Git URL rewrites
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout RocketBootstrap (Lessica fork)
        uses: actions/checkout@v4
        with:
          repository: Lessica/RocketBootstrap
          ref: ios15
          submodules: recursive
          fetch-depth: 1

      - name: Install ldid
        run: |
          brew install ldid
          ldid -v || true

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      - name: Fetch iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xz -C /tmp
          cp -r /tmp/sdks-master/iPhoneOS14.5.sdk "$THEOS/sdks/"
          echo "SYSROOT=$THEOS/sdks/iPhoneOS14.5.sdk" >> "$GITHUB_ENV"

      - name: Provide Rootless Stubs
        run: |
          set -e
          # Theos ships with a rootless stub for CydiaSubstrate. We reuse it
          # for both the missing TweakInject and libsubstrate links.
          SOURCE_STUB="$THEOS/vendor/lib/iphone/rootless/CydiaSubstrate.framework/CydiaSubstrate.tbd"
          
          mkdir -p libs/rootless
          if [ -f "$SOURCE_STUB" ]; then
            cp "$SOURCE_STUB" libs/rootless/TweakInject.tbd
            cp "$SOURCE_STUB" "$THEOS/lib/libsubstrate.tbd"
            echo "✅ Copied CydiaSubstrate.tbd to libs/rootless/TweakInject.tbd and $THEOS/lib/libsubstrate.tbd"
          else
            echo "❌ Stub not found at $SOURCE_STUB"
            exit 1
          fi

      - name: Fix legacy Theos path references
        run: |
          set -e
          ln -sfn "$THEOS" "$GITHUB_WORKSPACE/framework"
          find . -name 'Makefile' -type f -not -path './.git/*' | while read -r mf; do
            if grep -qE 'framework/(makefiles|extras)' "$mf"; then
              echo "Patching $mf"
              sed -i '' \
                -e 's#framework/makefiles#$(THEOS)/makefiles#g' \
                -e 's#framework/extras#$(THEOS)/extras#g' \
                "$mf"
            fi
          done

      - name: Fix header include case
        run: |
          set -e
          find . -type f \( -name '*.h' -o -name '*.m' -o -name '*.mm' -o -name '*.x' -o -name '*.xm' \) \
            -not -path './.git/*' | while read -r f; do
            if grep -q 'rocketbootstrap/rocketbootstrap\.h' "$f" 2>/dev/null; then
              echo "Patching $f"
              sed -i '' -e 's#\.\./rocketbootstrap/rocketbootstrap\.h#../RocketBootstrap/rocketbootstrap.h#g' "$f"
            fi
          done

      - name: Add Provides field to control file
        run: |
          set -e
          if ! grep -q '^Provides:' control; then
            echo "Provides: rocketbootstrap" >> control
            echo "Added Provides: rocketbootstrap to control file"
          fi

      - name: Compile Rootless Package
        run: |
          make package DEBUG=0 THEOS_PACKAGE_SCHEME=rootless \
            TARGET_CODESIGN=ldid \
            ADDITIONAL_CFLAGS="-Wno-error=nonportable-include-path -Wno-nonportable-include-path" \
            ADDITIONAL_OBJCFLAGS="-Wno-error=nonportable-include-path -Wno-nonportable-include-path"
        env:
          THEOS: ${{ github.workspace }}/theos
          SYSROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS14.5.sdk

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocketbootstrap-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
