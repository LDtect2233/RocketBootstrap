name: Build RocketBootstrap Rootless (arm64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git URL rewrites
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout project (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fix and initialize submodules over HTTPS
        run: |
          set -e
          if [ -f .gitmodules ]; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.url$' | while read -r key _; do
              cur=$(git config -f .gitmodules --get "$key")
              case "$cur" in
                git://github.com/*)
                  fixed="https://github.com/${cur#git://github.com/}"
                  git config -f .gitmodules "$key" "$fixed"
                  echo "Rewrote $key: $cur -> $fixed"
                  ;;
                git@github.com:*)
                  fixed="https://github.com/${cur#git@github.com:}"
                  git config -f .gitmodules "$key" "$fixed"
                  echo "Rewrote $key: $cur -> $fixed"
                  ;;
              esac
            done
            git submodule sync --recursive
            git submodule update --init --recursive --depth=1
          fi

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Key: install libtinfo5 to satisfy the shared library dependency of the Bingner toolchain clang
          sudo apt-get install -y \
            build-essential pkg-config git coreutils lzma \
            liblzma-dev libssl-dev libyaml-dev libxml2-dev \
            curl xz-utils fakeroot libtinfo5

      - name: Set up Theos Environment
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      # Key: Install the Linux iOS toolchain (Bingner version supports arm64e and is fully compatible with arm64)
      - name: Install Linux iOS Toolchain
        run: |
          set -e
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -L https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma \
            -o /tmp/toolchain.tar.lzma
          tar -xJf /tmp/toolchain.tar.lzma -C /tmp
          mv /tmp/ios-arm64e-clang-toolchain/* "$THEOS/toolchain/linux/iphone/"
          rm -rf /tmp/ios-arm64e-clang-toolchain /tmp/toolchain.tar.lzma
          echo "== Toolchain bin =="
          ls -la "$THEOS/toolchain/linux/iphone/bin/" | head -20
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Fetch iOS SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            | tar -xz -C /tmp
          cp -r /tmp/sdks-master/iPhoneOS14.5.sdk "$GITHUB_WORKSPACE/theos/sdks/"
          echo "SYSROOT=$GITHUB_WORKSPACE/theos/sdks/iPhoneOS14.5.sdk" >> "$GITHUB_ENV"

      - name: Fix legacy Theos path references
        run: |
          set -e
          ln -sfn "$THEOS" "$GITHUB_WORKSPACE/framework"
          find . -name 'Makefile' -type f -not -path './.git/*' | while read -r mf; do
            if grep -qE 'framework/(makefiles|extras)' "$mf"; then
              sed -i \
                -e 's#framework/makefiles#$(THEOS)/makefiles#g' \
                -e 's#framework/extras#$(THEOS)/extras#g' \
                "$mf"
            fi
          done
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Compile Rootless Package (arm64 only)
        run: |
          # Explicitly restrict to arm64, avoiding arm64e ABI issues
          make package DEBUG=0 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
        env:
          THEOS: ${{ github.workspace }}/theos
          SYSROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS14.5.sdk
          ARCHS: arm64

      - name: Verify architecture and rootless paths
        run: |
          DEB=$(ls packages/*.deb | head -1)
          echo "Inspecting $DEB"
          dpkg-deb -c "$DEB" | head -40
          if ! dpkg-deb -c "$DEB" | grep -q '/var/jb/'; then
            echo "❌ Package does not contain /var/jb/ paths"
            exit 1
          fi
          echo "✅ Rootless paths confirmed"
          # Extract and verify architecture
          mkdir -p /tmp/debcheck && dpkg-deb -x "$DEB" /tmp/debcheck
          find /tmp/debcheck -name '*.dylib' -exec file {} \; | grep -i 'arm64' || true

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocketbootstrap-rootless-deb-arm64
          path: packages/*.deb
          if-no-files-found: error
