name: Build RocketBootstrap Rootless

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Configure Git URL rewrites
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout project (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fix and initialize submodules over HTTPS
        run: |
          set -e
          if [ -f .gitmodules ]; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.url$' | while read -r key _; do
              cur=$(git config -f .gitmodules --get "$key")
              case "$cur" in
                git://github.com/*) fixed="https://github.com/${cur#git://github.com/}" ;;
                git@github.com:*)   fixed="https://github.com/${cur#git@github.com:}" ;;
                *) continue ;;
              esac
              git config -f .gitmodules "$key" "$fixed"
            done
            git submodule sync --recursive
            git submodule update --init --recursive --depth=1
          fi

      # NEW: ldid is not bundled with Theos — install it via Homebrew.
      - name: Install ldid
        run: |
          brew install ldid
          echo "== Verify ldid =="
          ldid -v || ldid --version || true

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      - name: Fetch iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz | tar -xz -C /tmp
          cp -r /tmp/sdks-master/iPhoneOS14.5.sdk "$THEOS/sdks/"
          echo "SYSROOT=$THEOS/sdks/iPhoneOS14.5.sdk" >> "$GITHUB_ENV"

      - name: Fix legacy Theos path references
        run: |
          set -e
          ln -sfn "$THEOS" "$GITHUB_WORKSPACE/framework"
          find . -name 'Makefile' -type f -not -path './.git/*' | while read -r mf; do
            grep -qE 'framework/(makefiles|extras)' "$mf" && \
              sed -i '' -e 's#framework/makefiles#$(THEOS)/makefiles#g' \
                        -e 's#framework/extras#$(THEOS)/extras#g' "$mf"
          done

      - name: Fix header include case
        run: |
          set -e
          find . -type f \( -name '*.h' -o -name '*.m' -o -name '*.mm' -o -name '*.x' -o -name '*.xm' \) \
            -not -path './.git/*' | while read -r f; do
            grep -q 'rocketbootstrap/rocketbootstrap\.h' "$f" 2>/dev/null && \
              sed -i '' -e 's#\.\./rocketbootstrap/rocketbootstrap\.h#../RocketBootstrap/rocketbootstrap.h#g' "$f"
          done

      - name: Force ARCHS=arm64 in all Makefiles
        run: |
          set -e
          find . -name 'Makefile' -type f -not -path './.git/*' | while read -r mf; do
            grep -qE '^[[:space:]]*(export[[:space:]]+)?ARCHS[[:space:]]*[:+]?=' "$mf" && \
              sed -i '' -E 's/^[[:space:]]*(export[[:space:]]+)?ARCHS[[:space:]]*[:+]?=.*/override ARCHS := arm64/' "$mf"
          done

      - name: Compile Rootless Package (arm64 only)
        run: |
          make package DEBUG=0 THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64 \
            TARGET_CODESIGN=ldid \
            ADDITIONAL_CFLAGS="-Wno-error=nonportable-include-path -Wno-nonportable-include-path" \
            ADDITIONAL_OBJCFLAGS="-Wno-error=nonportable-include-path -Wno-nonportable-include-path"
        env:
          THEOS: ${{ github.workspace }}/theos
          SYSROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS14.5.sdk
          ARCHS: arm64

      - name: Verify architecture and rootless paths
        run: |
          DEB=$(ls packages/*.deb | head -1)
          dpkg-deb -c "$DEB" | head -40
          dpkg-deb -c "$DEB" | grep -q '/var/jb/' || { echo "❌ not rootless"; exit 1; }
          echo "✅ rootless paths confirmed"

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocketbootstrap-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
