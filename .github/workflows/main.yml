name: Build RocketBootstrap Rootless

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git URL rewrites
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout project (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fix and initialize submodules over HTTPS
        run: |
          set -e
          if [ -f .gitmodules ]; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.url$' | while read -r key _; do
              cur=$(git config -f .gitmodules --get "$key")
              case "$cur" in
                git://github.com/*)
                  fixed="https://github.com/${cur#git://github.com/}"
                  git config -f .gitmodules "$key" "$fixed"
                  echo "Rewrote $key: $cur -> $fixed"
                  ;;
                git@github.com:*)
                  fixed="https://github.com/${cur#git@github.com:}"
                  git config -f .gitmodules "$key" "$fixed"
                  echo "Rewrote $key: $cur -> $fixed"
                  ;;
              esac
            done
            git submodule sync --recursive
            git submodule update --init --recursive --depth=1
          else
            echo "No .gitmodules found — nothing to do."
          fi

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config git coreutils lzma \
            liblzma-dev libssl-dev libyaml-dev libxml2-dev \
            curl xz-utils fakeroot

      - name: Set up Theos Environment
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      - name: Fetch iOS SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            | tar -xz -C /tmp
          cp -r /tmp/sdks-master/iPhoneOS14.5.sdk "$GITHUB_WORKSPACE/theos/sdks/"
          echo "SYSROOT=$GITHUB_WORKSPACE/theos/sdks/iPhoneOS14.5.sdk" >> "$GITHUB_ENV"

      # RocketBootstrap's Makefile uses the legacy relative path
      # "framework/makefiles/..." instead of $(THEOS)/makefiles/...
      # Provide a symlink so make can resolve it. Also patch the Makefile in
      # place (belt-and-suspenders) so any other legacy references resolve too.
      - name: Fix legacy Theos path references
        run: |
          set -e
          ln -sfn "$THEOS" "$GITHUB_WORKSPACE/framework"
          echo "Created symlink: $GITHUB_WORKSPACE/framework -> $THEOS"

          # Rewrite any "framework/makefiles" or "framework/extras" references
          # in Makefiles to use the absolute $THEOS path. This covers the case
          # where the symlink is not followed (e.g. when make resolves from a
          # different working directory).
          find . -name 'Makefile' -type f -not -path './.git/*' | while read -r mf; do
            if grep -qE 'framework/(makefiles|extras)' "$mf"; then
              echo "Patching $mf"
              sed -i \
                -e 's#framework/makefiles#$(THEOS)/makefiles#g' \
                -e 's#framework/extras#$(THEOS)/extras#g' \
                "$mf"
            fi
          done

          echo "== Patched Makefiles =="
          grep -rlE '\$\(THEOS\)/(makefiles|extras)' --include='Makefile' . || true

      - name: Show project layout (diagnostic)
        run: |
          echo "== Top-level =="
          ls -la
          echo "== Makefile head =="
          head -80 Makefile || true
          echo "== Symlink check =="
          ls -la framework
          ls -la framework/makefiles/tool.mk || echo "tool.mk NOT found via symlink"

      - name: Compile Rootless Package
        run: |
          # DEBUG=0 removes the build-number suffix without triggering the
          # macOS-only FINALPACKAGE=1 pipeline (which aborts on Linux with
          # "Building final package requires a legacy Xcode install!").
          make package DEBUG=0 THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: ${{ github.workspace }}/theos
          SYSROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS14.5.sdk

      - name: Verify rootless paths in .deb
        run: |
          DEB=$(ls packages/*.deb | head -1)
          echo "Inspecting $DEB"
          dpkg-deb -c "$DEB" | head -40
          if ! dpkg-deb -c "$DEB" | grep -q '/var/jb/'; then
            echo "❌ Package does not contain /var/jb/ paths — not truly rootless!"
            exit 1
          fi
          echo "✅ Rootless paths confirmed"

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocketbootstrap-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
