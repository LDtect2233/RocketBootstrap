name: Build RocketBootstrap Rootless

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Rewrite git:// -> https:// globally as a safety net (covers any git
      # invocation that bypasses our manual submodule handling below).
      - name: Configure Git URL rewrites
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      # Check out WITHOUT submodules. actions/checkout runs its own
      # `git submodule sync` internally, which overwrites any rewrite we set
      # and restores the git:// URL from .gitmodules — that's why the previous
      # attempt still timed out. Skipping submodules here sidesteps the issue.
      - name: Checkout project (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # Physically rewrite .gitmodules to HTTPS, sync, and pull submodules.
      # git config -f edits .gitmodules on disk (not a transient rewrite),
      # so `git submodule sync` propagates the HTTPS URL correctly.
      - name: Fix and initialize submodules over HTTPS
        run: |
          set -e
          if [ -f .gitmodules ]; then
            echo "== Before =="
            cat .gitmodules
            git config -f .gitmodules submodule.LightMessaging.url https://github.com/rpetrich/LightMessaging.git
            # Also catch any other submodule that might use git:// (future-proof)
            git config -f .gitmodules --get-regexp '^submodule\..*\.url$' | while read -r key _; do
              cur=$(git config -f .gitmodules --get "$key")
              case "$cur" in
                git://github.com/*)
                  fixed="https://github.com/${cur#git://github.com/}"
                  git config -f .gitmodules "$key" "$fixed"
                  echo "Rewrote $key: $cur -> $fixed"
                  ;;
              esac
            done
            echo "== After =="
            cat .gitmodules
            git submodule sync --recursive
            git submodule update --init --recursive --depth=1
          else
            echo "No .gitmodules found — nothing to do."
          fi

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config git coreutils lzma \
            liblzma-dev libssl-dev libyaml-dev libxml2-dev \
            curl xz-utils

      - name: Set up Theos Environment
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/theos/bin" >> "$GITHUB_PATH"

      - name: Fetch iOS SDK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz \
            | tar -xz -C /tmp
          cp -r /tmp/sdks-master/iPhoneOS14.5.sdk "$GITHUB_WORKSPACE/theos/sdks/"
          echo "SYSROOT=$GITHUB_WORKSPACE/theos/sdks/iPhoneOS14.5.sdk" >> "$GITHUB_ENV"

      - name: Verify submodules checked out
        run: |
          echo "== .gitmodules =="
          cat .gitmodules || echo "(no .gitmodules)"
          echo "== submodule status =="
          git submodule status --recursive
          echo "== LightMessaging contents =="
          ls -la LightMessaging 2>/dev/null | head -20 || echo "(LightMessaging missing)"

      - name: Compile Rootless Package
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: ${{ github.workspace }}/theos
          SYSROOT: ${{ github.workspace }}/theos/sdks/iPhoneOS14.5.sdk

      - name: Verify rootless paths in .deb
        run: |
          DEB=$(ls packages/*.deb | head -1)
          echo "Inspecting $DEB"
          dpkg-deb -c "$DEB" | head -40
          if ! dpkg-deb -c "$DEB" | grep -q '/var/jb/'; then
            echo "❌ Package does not contain /var/jb/ paths — not truly rootless!"
            exit 1
          fi
          echo "✅ Rootless paths confirmed"

      - name: Upload Rootless .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocketbootstrap-rootless-deb
          path: packages/*.deb
          if-no-files-found: error
